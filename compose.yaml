name: harvey-pw-fleet-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chopw_fleet
      POSTGRES_USER: chopw
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chopw -d chopw_fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  fleet_postgres_data:

