name: harvey-pw-fleet

x-app-environment: &app-environment
  env_file:
    - ${FLEET_APP_ENV_FILE:-/etc/harvey-pw-fleet/app.env}
  environment:
    FILE_STORAGE_ROOT: /app/data/uploads
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"

services:
  postgres:
    image: postgres:17.6-alpine
    env_file:
      - ${FLEET_DATABASE_ENV_FILE:-/etc/harvey-pw-fleet/database.env}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/harvey-pw-fleet/database-tls/server.crt
      - -c
      - ssl_key_file=/run/harvey-pw-fleet/database-tls/server.key
      - -c
      - ssl_ca_file=/run/harvey-pw-fleet/database-tls/ca.crt
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data
      - ${FLEET_DATABASE_TLS_DIR:-/etc/harvey-pw-fleet/database-tls}:/run/harvey-pw-fleet/database-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    expose:
      - "5432"
    restart: unless-stopped

  app:
    build:
      context: .
      target: runner
    image: ${FLEET_APP_IMAGE:-harvey-pw-fleet:local}
    <<: *app-environment
    ports:
      - "127.0.0.1:${FLEET_HTTP_PORT:-3000}:3000"
    volumes:
      - fleet_uploads:/app/data/uploads
      - ${FLEET_DATABASE_CA_HOST_FILE:-/etc/ssl/certs/ca-certificates.crt}:/run/harvey-pw-fleet/database-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build:
      context: .
      target: worker
    image: ${FLEET_WORKER_IMAGE:-harvey-pw-fleet-worker:local}
    <<: *app-environment
    profiles: ["jobs"]
    volumes:
      - fleet_uploads:/app/data/uploads
      - ${FLEET_DATABASE_CA_HOST_FILE:-/etc/ssl/certs/ca-certificates.crt}:/run/harvey-pw-fleet/database-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  preflight:
    build:
      context: .
      target: worker
    image: ${FLEET_WORKER_IMAGE:-harvey-pw-fleet-worker:local}
    <<: *app-environment
    profiles: ["tools"]
    command: ["pnpm", "production:preflight"]
    volumes:
      - fleet_uploads:/app/data/uploads
      - ${FLEET_DATABASE_CA_HOST_FILE:-/etc/ssl/certs/ca-certificates.crt}:/run/harvey-pw-fleet/database-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    volumes:
      - clamav_signatures:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db-tools:
    image: postgres:17.6-alpine
    env_file:
      - ${FLEET_APP_ENV_FILE:-/etc/harvey-pw-fleet/app.env}
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/harvey-pw-fleet/database-ca.pem
    volumes:
      - ${FLEET_DATABASE_CA_HOST_FILE:-/etc/ssl/certs/ca-certificates.crt}:/run/harvey-pw-fleet/database-ca.pem:ro
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c"]

volumes:
  fleet_postgres_data:
    name: ${FLEET_DATABASE_VOLUME:-harvey-pw-fleet_database}
  fleet_uploads:
    name: ${FLEET_UPLOADS_VOLUME:-harvey-pw-fleet_uploads}
  clamav_signatures:
